name: Build YHM Coach iPhone app

# Every push builds the iPhone app on a Mac in GitHub's cloud to check it compiles.
# When the App Store Connect secrets are set, it also signs the app and uploads it
# to App Store Connect (TestFlight), ready to send for App Store review.
#
# Secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID        10-character Team ID (developer.apple.com → Account → Membership details)
#   ASC_KEY_ID           App Store Connect API key ID
#   ASC_ISSUER_ID        App Store Connect API issuer ID
#   ASC_KEY_P8_BASE64    the downloaded AuthKey_XXXX.p8 file, base64-encoded

on:
  push:
    branches: [main]
    paths-ignore: ['watchface/**', '.github/workflows/build-watchface.yml', 'docs/**', 'android/**', '.github/workflows/build-apk.yml', '*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash   # bash -eo pipefail: a failing xcodebuild fails the step even when piped to tail
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_P8_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install packages
        run: npm ci

      - name: Build web app and copy into iOS
        run: |
          npm run build:web
          npx cap sync ios

      - name: Version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Check the app compiles (simulator, unsigned)
        if: ${{ env.HAS_ASC != 'true' }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" build | tail -40
          cd "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" && zip -qr "$GITHUB_WORKSPACE/YHM-Coach-simulator.zip" App.app

      - name: Upload simulator build
        if: ${{ env.HAS_ASC != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: YHM-Coach-iOS-simulator-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: YHM-Coach-simulator.zip

      - name: Sign, archive and upload to App Store Connect
        if: ${{ env.HAS_ASC == 'true' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \n\r' | base64 -d > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}" archive | tail -40

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -40
          rm -f "$KEY"
          echo "Uploaded YHM Coach $APP_VERSION ($BUILD_NUMBER) to App Store Connect. It appears in TestFlight after Apple finishes processing (5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"
